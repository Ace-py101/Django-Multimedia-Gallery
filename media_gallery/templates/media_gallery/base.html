{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Multimedia Gallery
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'media_gallery/css/style.css' %}"
    >
</head>

<body>

    <header class="site-header">

        <div class="container">

            <h1 class="site-title">
                Multimedia Gallery
            </h1>

            <nav class="site-nav">
                <a href="{% url 'home' %}">
                    Home
                </a>
            </nav>

        </div>

    </header>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Multimedia Gallery
            </p>

        </div>

    </footer>

</body>

</html>
